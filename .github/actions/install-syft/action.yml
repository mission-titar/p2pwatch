name: Install Syft
description: >
  Install the pinned Syft release on PATH, its checksums verified with cosign against
  anchore's release workflow before the binary is checked against them.
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - shell: bash
      env:
        # Left true, the script runs the tag's install.sh from get.anchore.io instead of itself.
        DOWNLOAD_TAG_INSTALL_SCRIPT: 'false'
      run: |
        curl -sSfL -o "$RUNNER_TEMP/install-syft.sh" \
          https://raw.githubusercontent.com/anchore/syft/b254e6d92f28c3868a755f62fb3ca8f26e9fee76/install.sh # v1.54.1
        sh "$RUNNER_TEMP/install-syft.sh" -v -b "$HOME/.local/bin" v1.54.1
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
