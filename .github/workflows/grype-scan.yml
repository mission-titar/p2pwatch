name: Grype daily SBOM scan

on:
  schedule:
    # Every morning at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write  # required to upload SARIF to GitHub code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v4's single image until v5 ships: signed under the repository's old name, and no versioned
        # file holds its VEX, so the attested one.
        include:
          - package: mulewatch
            image: ghcr.io/mission-titar/mulewatch
            signer: mission-titar/mulewatch
            vex: /tmp/vex.openvex.json
    env:
      IMAGE: ${{ matrix.image }}
      VEX: ${{ matrix.vex }}
    steps:
      - name: Check out the repository (for the vex_checks consistency checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and sync the dev environment
        uses: ./.github/actions/setup-uv-env
        with:
          save-cache: 'false'  # restore only; validate is the x86 cache writer

      - name: Install Grype, verified
        uses: ./.github/actions/install-grype

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The main scan's SBOM and VEX come from the image's own signed attestations (the repo
      # checkout above serves only the vex_checks consistency checks below). verify-attestation
      # (not merely fetch) proves the SBOM and VEX were produced by OUR release.yml for THIS
      # image digest. jq decodes the DSSE payload and extracts the raw predicate.
      #   - Syft-JSON SBOM (type https://syft.dev/bom): scanned instead of CycloneDX because
      #     it preserves the image source identity image-scoped OpenVEX matching needs.
      #   - OpenVEX (type openvex): applied via Grype's --vex.
      - name: Extract SBOM and VEX from image attestations
        env:
          CERT_REGEXP: "^${{ github.server_url }}/${{ matrix.signer }}/.github/workflows/release.yml@refs/"
        run: |
          verify() {  # $1 = predicate type -> stdout: the raw predicate JSON
            cosign verify-attestation \
              --type "$1" \
              --certificate-identity-regexp "${CERT_REGEXP}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE}:latest" \
              | jq -rs '.[0].payload | @base64d | fromjson | .predicate'
          }
          verify "https://syft.dev/bom" > /tmp/sbom.syft.json
          verify openvex                > /tmp/vex.openvex.json

      # The two vex_checks image checks run in SARIF mode against the leg's VEX: they always
      # exit 0, so a drift surfaces in Code scanning rather than failing this daily job.
      - name: Check image-family VEX claims against the SBOM
        run: >
          uv run python -m vex_checks image-claims
          --sbom /tmp/sbom.syft.json
          --vex "$VEX"
          --sarif /tmp/image-claims.sarif

      - name: Upload image-claims SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: /tmp/image-claims.sarif
          category: vex-image-claims-${{ matrix.package }}

      - name: Check that Grype reports every VEX claim and applies it to every match
        run: >
          uv run python -m vex_checks applied-claims
          --sbom /tmp/sbom.syft.json
          --vex "$VEX"
          --sarif /tmp/applied-claims.sarif

      - name: Upload applied-claims SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: /tmp/applied-claims.sarif
          category: vex-applied-claims-${{ matrix.package }}

      # Scans the SBOM (not the live image) so results are reproducible, applying the leg's VEX.
      # No --fail-on: findings are surfaced via SARIF, not a job failure; triage happens through VEX.
      - name: Run Grype against the attested SBOM
        run: grype sbom:/tmp/sbom.syft.json --vex "$VEX" -o sarif --file /tmp/grype.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: /tmp/grype.sarif
          category: grype-${{ matrix.package }}
