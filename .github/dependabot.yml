# Dependabot: keep dependencies up to date. One grouped weekly PR per ecosystem.
version: 2
updates:
  # GitHub Actions: scans .github/workflows/*.yml AND our composite action.yml
  # files (.github/actions/*/action.yml); bumps the pinned SHA and the trailing
  # "# vX.Y.Z" comment. Local "./..." action refs are ignored.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The FROM lines of each image's Dockerfile; compose image refs are not covered.
  # One entry per image: an open group pull request defers every directory it does not list.
  - package-ecosystem: "docker"
    directory: "/packages/amule"
    schedule:
      interval: "weekly"
    # The default 3 days restart on each re-push of a tag, which held Debian's security digests back.
    cooldown:
      default-days: 0
    groups:
      amule-image:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/packages/crawler"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 0
    groups:
      crawler-image:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(docker)"

  # Python dependencies: the uv workspace (root pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # The lock ships in the image, so transitive dependencies are bumped too, not only direct ones.
    allow:
      - dependency-type: "all"
    # Only versions published a week ago: a compromised release is usually caught by then.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
