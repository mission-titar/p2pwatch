# Imports point inward, adapters never import each other (2026-10-18-hexagonal-architecture.md).
# A deprecated edge is a temporary exception; the comment above names why and the lot removing it.
# tach check never sees an import across distributions: check-external holds them to each pyproject.
source_roots = [
  "packages/amule/src",
  "packages/amule_bump/src",
  "packages/coverage_checks/src",
  "packages/crawler/src",
  "packages/matching/src",
  "packages/template_checks/src",
  "packages/vex_checks/src",
]
exclude = ["**/__pycache__"]
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
layers_explicit_depends_on = true
root_module = "forbid"
layers = ["composition", "adapters", "application", "ports", "domain"]

