# Imports point inward, adapters never import each other (2026-10-18-hexagonal-architecture.md).
# A deprecated edge is a temporary exception; the comment above names why and the lot removing it.
# tach check never sees an import across distributions: check-external holds them to each pyproject.
source_roots = [
  "packages/amule/src",
  "packages/amule_bump/src",
  "packages/coverage_checks/src",
  "packages/crawler/src",
  "packages/matching/src",
  "packages/template_checks/src",
  "packages/vex_checks/src",
]
exclude = ["**/__pycache__"]
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
layers_explicit_depends_on = true
root_module = "forbid"
layers = ["composition", "adapters", "application", "ports", "domain"]

[[modules]]
path = "amule_bump.__main__"
layer = "composition"
depends_on = [
  "amule_bump.adapters.driven.github_repo_reader",
  "amule_bump.adapters.driving.bump",
  "amule_bump.adapters.driving.cli",
  "amule_bump.domain",
]

[[modules]]
path = "amule_bump.adapters.driven.github_repo_reader"
layer = "adapters"
depends_on = ["amule_bump.ports.driven.repo_reader"]

[[modules]]
path = "amule_bump.adapters.driving.bump"
layer = "adapters"
depends_on = [
  "amule_bump.domain",
  # The bump calls the use cases past any driving port: lot 3 gives it one.
  { path = "amule_bump.application", deprecated = true },
  # The bump hands the use cases their driven port: lot 3's driving port takes it over.
  { path = "amule_bump.ports.driven.repo_reader", deprecated = true },
]

