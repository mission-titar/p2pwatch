  "p2pwatch.adapters.driven.mule_api",
  "p2pwatch.adapters.driven.observability",
  "p2pwatch.adapters.driven.persistence_sqlite",
  "p2pwatch.adapters.driven.rng_random",
  "p2pwatch.adapters.driven.wake_hub_asyncio",
  "p2pwatch.adapters.driven.wall_clock_system",
  "p2pwatch.adapters.driving.process",
  "p2pwatch.adapters.driving.webui",
  "p2pwatch.application",
  "p2pwatch.domain",
  "p2pwatch.ports.driven.clock",
  "p2pwatch.ports.driving.crawler_control",
  "p2pwatch.ports.driving.crawler_runner",
]

