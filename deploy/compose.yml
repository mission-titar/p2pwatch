# The core, plus one include line per network. Each network comes in a direct and a vpn variant:
# swap `direct` for `vpn` in its line to put that network behind its own VPN.
# The catalog on 8080 has NO password: put it behind a reverse proxy or a VPN.
name: p2pwatch

include:
  - ed2k/direct.compose.yml

services:
  p2pwatch:
    image: ghcr.io/mission-titar/p2pwatch:latest
    user: "${PUID:?}:${PGID:?}"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    restart: unless-stopped
    environment:
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
    ports:
      - "8080:8080"
    volumes:
      - ./crawler.yml:/app/config/crawler.yml:ro
      - ./targets.yml:/app/config/targets.yml:ro
      - ./matcher.yml:/app/config/matcher.yml:ro
      - ./data:/data
      # Measured for the disk floor, never written.
      - ./ed2k/downloads:/downloads:ro
