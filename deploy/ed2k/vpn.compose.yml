# eD2k and Kad behind gluetun; the core stays outside the tunnel. VPN_PORT_FORWARDING=on in .env
# gives High-ID and turns port-sync on. aMule's web UI on 4711 is protected by AMULE_API_PASSWORD.

services:
  ed2k-gluetun:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
    # ed2k has no network of its own: the core reaches it through this alias.
    networks:
      default:
        aliases: [ed2k]
    ports:
      - "4711:4711"
    # gluetun's default path for its roles; a route no role names answers 401.
    configs:
      - source: gluetun-auth
        target: /gluetun/auth/config.toml
    restart: unless-stopped

  ed2k:
    extends:
      file: service.compose.yml
      service: ed2k
    # Here and not in the fragment: `extends:` never carries depends_on over.
    network_mode: "service:ed2k-gluetun"
    depends_on: [ed2k-gluetun]
    environment:
      PORT_SYNC: ${VPN_PORT_FORWARDING:-off}

# Port-sync only reads the forwarded port: every other route, stopping the VPN included, stays closed.
configs:
  gluetun-auth:
    content: |
      [[roles]]
      name = "port-sync"
      auth = "none"
      routes = ["GET /v1/portforward"]
