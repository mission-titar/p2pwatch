# aMule's service, shared by the direct and vpn variants through `extends:`; each adds its network.

services:
  ed2k:
    image: ghcr.io/mission-titar/p2pwatch-amule:latest
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      AMULE_EC_PASSWORD: ${AMULE_EC_PASSWORD:?}
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
    volumes:
      - ./amule:/home/amule/.aMule
      - ./downloads:/downloads
    # Healthy when amuleapi answers and reports its link to amuled.
    healthcheck:
      test: ["CMD", "python", "-m", "p2pwatch_amule", "health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
