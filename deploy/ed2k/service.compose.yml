# aMule's service, shared by the direct and vpn variants through `extends:`; each adds its network.

services:
  ed2k:
    image: ghcr.io/mission-titar/p2pwatch-amule:latest
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      AMULE_EC_PASSWORD: ${AMULE_EC_PASSWORD:?}
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
    volumes:
      - ./amule:/home/amule/.aMule
      - ./downloads:/downloads
    # s6-svstat exits 0 for a stopped service too, so test what it prints, not its exit code.
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(s6-svstat -u /etc/services.d/amuled)" = true']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
