# eD2k and Kad on this machine's own address. Low-ID unless your router forwards 4662/tcp and
# 4672/udp here. aMule's web UI on 4711 is protected by AMULE_API_PASSWORD.

services:
  ed2k:
    extends:
      file: service.compose.yml
      service: ed2k
    ports:
      - "4711:4711"
      - "4662:4662"
      - "4672:4672/udp"
