# Standalone SMOKE stack (compose_integration test). NOT a real deployment: it uses the
# tests/smoke/ configs and a throwaway state directory, without gluetun.
# port-sync stays down (no PORT_SYNC) until a test starts it; it then polls every second.
# Driven by packages/crawler/tests/integration/test_compose_smoke.py.
# Invoked with --project-directory <repo root>: every relative path resolves against the repo
# root (context=., configs ./tests/smoke/*.yml).
#
# No `restart:` (default `no`): a crash must show as an exited container, not a backoff loop.
services:
  ed2k:
    image: ghcr.io/mission-titar/p2pwatch-amule:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/amule/Dockerfile
    # PID 1 is root: it creates the amule user and takes the bind mounts.
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      AMULE_EC_PASSWORD: ${AMULE_EC_PASSWORD:?}
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
      PORT_SYNC_POLL_SECONDS: "1"
    volumes:
      - ${SMOKE_STATE:-/tmp/p2pwatch-smoke}/amule:/home/amule/.aMule
      - ${SMOKE_STATE:-/tmp/p2pwatch-smoke}/downloads:/downloads
    # s6-svstat exits 0 for a stopped service too: test what it prints, not its exit code.
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(s6-svstat -u /etc/services.d/amuled)" = true']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  p2pwatch:
    image: ghcr.io/mission-titar/p2pwatch:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/crawler/Dockerfile
    # No entrypoint runs as root, so `user:` is what makes data/ the operator's.
    user: "${PUID:?}:${PGID:?}"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    environment:
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
    volumes:
      - ./tests/smoke/crawler.yml:/app/config/crawler.yml:ro
      - ./tests/smoke/targets.yml:/app/config/targets.yml:ro
      # The matcher policy has exactly ONE copy in the repo (AGENTS.md): the operator's.
      - ./deploy/matcher.yml:/app/config/matcher.yml:ro
      - ${SMOKE_STATE:-/tmp/p2pwatch-smoke}/data:/data
      # Measured with statvfs for the disk floor, never written.
      - ${SMOKE_STATE:-/tmp/p2pwatch-smoke}/downloads:/downloads:ro
