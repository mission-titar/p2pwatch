id: application-imports
language: python
severity: error
message: A use case imports only the pure standard library on this list and first-party packages; the dependency checks keep those to its own hexagon.
note: "A module that needs I/O goes behind a port; a new pure module is a new line here."
files: ["packages/*/src/*/application/**/*.py"]
rule:
  matches: imported-module
  not:
    regex: ^(asyncio|collections\.abc|contextlib|dataclasses|datetime|difflib|pathlib|re|textwrap|typing|(amule_bump|catalog_matching|coverage_checks|p2pwatch|p2pwatch_amule|template_checks|vex_checks)(\.\w+)*)$
