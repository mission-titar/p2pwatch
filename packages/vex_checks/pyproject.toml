[project]
name = "vex-checks"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = ["packaging>=26.3"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Dev/CI-only tooling, never shipped in a prod image, but it follows the same shared root git
# tag as the three product packages for uniformity (spec 2026-07-10-git-driven-versioning).
# See the crawler pyproject for the full rationale (search_parent_directories + milestone-tag exclude).
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
search_parent_directories = true
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "*-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vex_checks"]

[tool.pytest.ini_options]
addopts = "--cov=vex_checks --cov-branch --cov-report=term-missing --cov-fail-under=100 --cov-context=test"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vex_checks"]

[tool.deptry]
# Replaces the default list, whose `tests` pattern silently drops the tests root.
exclude = ["\\.venv"]
known_first_party = ["tests"]
# A pytest plugin, loaded through its entry point and never imported.
per_rule_ignores = { DEP002 = ["pytest-cov"] }

# Import errors only, mypy checks the types; `.` resolves `tests`, so Serena's renames reach its doubles.
[tool.pyrefly]
python-interpreter-path = "../../.venv/bin/python"
search-path = ["src", "."]
preset = "off"

[tool.pyrefly.errors]
missing-import = "error"
missing-module-attribute = "error"
