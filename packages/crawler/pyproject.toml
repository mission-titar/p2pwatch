"tests/test_contract_subclasses.py" = "every package's contracts: each implementation of a contracted port runs its contract"
"tests/test_fake_files.py" = "every package's tests/fakes: one double per file, in the ring of what it replaces"
"tests/test_port_files.py" = "every hexagon's port files: one port per file"
"tests/test_workspace_dependencies.py" = "every package's pyproject.toml: hexagon isolation"

[tool.sqlfluff.core]
dialect = "sqlite"
max_line_length = 100

[tool.sqlfluff.rules.references.keywords]
ignore_words = "key,value"

[tool.deptry]
# Replaces the default list, whose `tests` pattern silently drops the tests root.
exclude = ["\\.venv"]
known_first_party = ["tests"]
# pytest plugins, loaded through their entry points and never imported.
per_rule_ignores = { DEP002 = ["pytest-cov", "pytest-asyncio"] }

# Import errors only, mypy checks the types; `.` resolves `tests`, so Serena's renames reach its doubles.
[tool.pyrefly]
python-interpreter-path = "../../.venv/bin/python"
search-path = ["src", "."]
preset = "off"

[tool.pyrefly.errors]
missing-import = "error"
missing-module-attribute = "error"
