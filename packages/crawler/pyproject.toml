[project]
name = "p2pwatch"
dynamic = ["version"]
description = "Crawler eMule: surveillance, catalogue, auto-download (Keroro VF lost media)"
requires-python = ">=3.13"
dependencies = [
    "apprise>=2.0.0",
    "catalog-matching",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
    "prometheus-client>=0.26.0",
    "starlette>=1.3",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "pytest-asyncio>=1.2"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version derived from a single pushed, pure-semver git tag `vX.Y.Z` (spec
# 2026-07-10-git-driven-versioning). The tag lives at the shared repo root, so all four
# workspace members resolve to the same number. tag-pattern extracts the version; the describe
# command below is the part that actually matters: the milestone tags `vX.Y.Z-<name>` are the
# NEAREST tags on every commit, so without `--exclude '*-*'` git describe returns one of them
# and setuptools-scm fails to parse it (empirically verified). Excluding dashed tags makes it
# fall back to the last pure-semver tag (`v0.19.1` -> e.g. `0.19.2.dev219+g<sha>`). The Docker
# build has no `.git`; it injects SETUPTOOLS_SCM_PRETEND_VERSION, which overrides all of this.
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# The .git lives at the shared repo root, not in this member dir: without this, setuptools-scm
# refuses to look in parent directories and reports "version missing" (falling back to 0.0.0).
search_parent_directories = true
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "*-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p2pwatch"]

[tool.pytest.ini_options]
addopts = '--cov=p2pwatch --cov=tests --cov-report=term-missing --cov-fail-under=100 --cov-context=test -m "not api_integration and not orchestration_integration and not download_integration and not compose_integration"'
testpaths = ["tests"]
markers = [
    "api_integration: amuleapi adapter against a real daemon provided by the caller (P2PWATCH_TEST_API_HOST, see docs/contributing/testing.md); deselected by default, dedicated run: cd packages/crawler && uv run pytest -m api_integration --no-cov",
    "orchestration_integration: real crawl loop against a real amuled provided by the caller (P2PWATCH_TEST_API_HOST, see docs/contributing/testing.md); deselected by default, dedicated run: cd packages/crawler && uv run pytest -m orchestration_integration --no-cov",
    "download_integration: start plus downloads read against a real amuled provided by the caller (P2PWATCH_TEST_API_HOST, see docs/contributing/testing.md); deselected by default, dedicated run: cd packages/crawler && uv run pytest -m download_integration --no-cov",
    "compose_integration: e2e smoke of the assembled docker compose stack (no VPN), Docker and compose required; deselected by default, dedicated run: cd packages/crawler && uv run pytest -m compose_integration --no-cov",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["p2pwatch", "tests"]
# The doubles and helpers are measured, the tests and conftests are not.
omit = ["tests/**/test_*.py", "tests/**/conftest.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

# Test files that test no module of `src`, each with what it tests (_unit-coverage-check).
[tool.coverage_checks.tests_without_unit]
"tests/adapters/driven/persistence_sqlite/test_append_only.py" = "the catalog's append-only triggers, in SQL"
