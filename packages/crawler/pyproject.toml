"tests/fakes/adapters/driven/test_fake_backoff_state_store.py" = "a fake of tests/fakes, against its contract"
"tests/fakes/adapters/driven/test_fake_blocking_monotonic_clock.py" = "a double of tests/fakes"
"tests/fakes/adapters/driven/test_fake_decision_reader.py" = "a double of tests/fakes"
"tests/fakes/adapters/driven/test_fake_logger.py" = "a double of tests/fakes"
"tests/fakes/adapters/driven/test_fake_loop_monotonic_clock.py" = "a fake of tests/fakes, against its contract"
"tests/fakes/adapters/driven/test_fake_monotonic_clock.py" = "a fake of tests/fakes, against its contract"
"tests/fakes/adapters/driven/test_fake_no_set_state_tracked_download_store.py" = "a double of tests/fakes"
"tests/fakes/adapters/driven/test_fake_node_id_store.py" = "a fake of tests/fakes, against its contract"
"tests/fakes/adapters/driven/test_fake_observation_reader.py" = "a double of tests/fakes"
