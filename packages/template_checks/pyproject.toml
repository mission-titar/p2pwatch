[project]
name = "template-checks"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Dev/CI tooling, never shipped in a prod image: versioned from the shared root git tag like
# every member (see the crawler pyproject for the rationale).
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
search_parent_directories = true
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "*-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/template_checks"]

[tool.pytest.ini_options]
addopts = "--cov=template_checks --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["template_checks"]
