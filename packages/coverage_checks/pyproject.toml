[project]
name = "coverage-checks"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = ["coverage>=7.16"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Dev/CI tooling, never shipped in a prod image: versioned from the shared root git tag like
# every member (see the crawler pyproject for the rationale).
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
search_parent_directories = true
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*.[0-9]*.[0-9]*", "--exclude", "*-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_checks"]

[tool.pytest.ini_options]
addopts = "--cov=coverage_checks --cov-branch --cov-report=term-missing --cov-fail-under=100 --cov-context=test"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["coverage_checks"]

[tool.deptry]
# Replaces the default list, whose `tests` pattern silently drops the tests root.
exclude = ["\\.venv"]
known_first_party = ["tests"]
# A pytest plugin, loaded through its entry point and never imported.
per_rule_ignores = { DEP002 = ["pytest-cov"] }
