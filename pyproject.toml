[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
catalog-matching = { workspace = true }
p2pwatch = { workspace = true }
pytest-settings = { workspace = true }

# The workspace's tools only: `uv sync` installs every member and its own `dev` group.
[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "mypy>=2.3.1",
  "ruff>=0.16.9",
  "sqlfluff>=4.3.0",
  "types-pyyaml>=6.0.12.20260906",
  "poethepoet>=0.48.0",
  "zensical==0.0.66",
  "ast-grep-cli>=0.50.0",
  "vulture>=2.16",
  "tach==0.35.3",
  "pyrefly==1.4.0",
  "pytest-settings",
]

[tool.ruff]
line-length = 100
# The members' requires-python: a virtual workspace's root has none for ruff to read.
target-version = "py313"
# Specs, plans and handoffs are records: ruff 0.16 would reformat their Python snippets.
extend-exclude = ["agents/**/*.md"]
src = [
  "packages/crawler/src",
  "packages/amule/src",
  "packages/matching/src",
  "packages/vex_checks/src",
  "packages/template_checks/src",
  "packages/coverage_checks/src",
  "packages/amule_bump/src",
  "packages/pytest_settings/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID251", "PLR0917"]

# A value past the first is named at the call, so two of one type cannot swap unseen.
[tool.ruff.lint.pylint]
max-positional-args = 1

# Named, not found on disk: else a module not yet written sorts third-party, and the cache keeps it.
[tool.ruff.lint.isort]
known-first-party = [
  "p2pwatch",
  "p2pwatch_amule",
  "catalog_matching",
  "vex_checks",
  "template_checks",
  "coverage_checks",
  "amule_bump",
  "pytest_settings",
  "tests",
]

# Only the clock adapters read the system clock or sleep; asyncio's own timeouts run on the loop's time.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject the WallClock port."
"datetime.datetime.utcnow".msg = "Inject the WallClock port."
"datetime.datetime.today".msg = "Inject the WallClock port."
"datetime.date.today".msg = "Inject the WallClock port."
"time.time".msg = "Inject the WallClock port."
"time.time_ns".msg = "Inject the WallClock port."
"time.monotonic".msg = "Inject the MonotonicClock port."
"time.monotonic_ns".msg = "Inject the MonotonicClock port."
"time.perf_counter".msg = "Inject the MonotonicClock port."
"time.perf_counter_ns".msg = "Inject the MonotonicClock port."
"time.clock_gettime".msg = "Inject the WallClock or the MonotonicClock port."
"time.clock_gettime_ns".msg = "Inject the WallClock or the MonotonicClock port."
"asyncio.sleep".msg = "Sleep through the MonotonicClock port."
"time.sleep".msg = "Sleep through the MonotonicClock port."
# ruff exempts an `@override` method from PLR0917.
"typing.override".msg = "A signature takes one positional parameter at most, overriding or not."
"typing_extensions.override".msg = "A signature takes one positional parameter at most, overriding or not."
"typing.Callable".msg = "Declare a callback Protocol: a Callable cannot name its parameters."
"typing_extensions.Callable".msg = "Declare a callback Protocol: a Callable cannot name its parameters."
"collections.abc.Callable".msg = "Declare a callback Protocol: a Callable cannot name its parameters."
"typing.NamedTuple".msg = "Declare a kw_only dataclass: a tuple's constructor is positional."
"typing_extensions.NamedTuple".msg = "Declare a kw_only dataclass: a tuple's constructor is positional."
"collections.namedtuple".msg = "Declare a kw_only dataclass: a tuple's constructor is positional."

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["B018", "F821"]
# The zones not yet keyword-only: each line goes with the block that converts its zone. Its globs
# never use `*` for a file name, which ruff lets cross a `/`.
"packages/{amule,amule_bump}/**" = ["PLR0917"]  # M2
"packages/vex_checks/**" = ["PLR0917"]  # M3
"packages/crawler/src/p2pwatch/domain/**" = ["PLR0917"]  # C1a
"packages/crawler/src/p2pwatch/application/**" = ["PLR0917"]  # C2
"packages/crawler/src/p2pwatch/adapters/driven/persistence_sqlite/**" = ["PLR0917"]  # C3
"packages/crawler/src/p2pwatch/{adapters/driven/[!p]*,adapters/driving/**,composition/**}" = ["PLR0917"]  # C4, `[!p]` skips C3
"packages/crawler/tests/{conftest.py,test_*.py,fakes/**,support/**,contracts/**,integration/**}" = ["PLR0917"]  # C5
"packages/crawler/tests/adapters/**" = ["PLR0917"]  # C6
"packages/crawler/tests/{application,domain,composition}/**" = ["PLR0917"]  # C7

[tool.mypy]
python_version = "3.13"
strict = true
enable_error_code = ["deprecated"]

# For editors, not the gate: without the venv, no import resolves.
[tool.pyright]
venvPath = "."
venv = ".venv"

# For Serena's language server, not the gate: Serena hands pyrefly its own interpreter.
[tool.pyrefly]
python-interpreter-path = "./.venv/bin/python"

# Task runner (poethepoet). The gate lives here as the single source of truth; the
# pre-push hook and CI both call these tasks. `uv run poe` lists them with their help.
[tool.poe.tasks]
lint           = { cmd = "ruff check .", help = "Lint Python with ruff" }
format-check   = { cmd = "ruff format --check .", help = "Check Python formatting with ruff" }
sql-lint       = { cmd = "sqlfluff lint packages/crawler/src", help = "Lint the embedded SQLite migrations" }
# The rule tests check each case's verdict, without snapshots of the messages.
code-pattern-check = { help = "Ban dynamic attribute access, module patching, Protocol ports, dataclasses not keyword-only, SQLite connections opened outside the opener, literal logger names and option defaults, Readers' and Writers' other verbs, and the core's other imports and I/O builtins (ast-grep, sgconfig.yml), rules tested first", sequence = [{ cmd = "ast-grep test --skip-snapshot-tests" }, { cmd = "ast-grep scan" }] }
architecture-check = { help = "Check the imports between rings, adapters and hexagons (tach, tach.toml)", sequence = [{ cmd = "tach check" }, { cmd = "tach check-external" }] }
template-check = { cmd = "python -m template_checks logic-free packages/crawler/src/p2pwatch/adapters/driving/webui/templates", help = "Assert webui templates carry no logic" }
_template-attributes = { cmd = "python -m template_checks template-attributes packages/crawler/src/p2pwatch/adapters/driving/webui/templates" }
dead-code-check = { shell = 'vulture --ignore-names "$TEMPLATE_ATTRIBUTES"', uses = { TEMPLATE_ATTRIBUTES = "_template-attributes" }, help = "Find code no production path reaches (vulture on src, the templates' attributes ignored)" }
vex-source-claims  = { cmd = "ast-grep scan --config packages/vex_checks/ast-grep/sgconfig.yml", help = "Assert our source never reaches code the not_in_execute_path VEX claims exempt (ast-grep, one source rule per claim)" }
vex-claim-coverage = { cmd = "python -m vex_checks claim-coverage", help = "Assert every VEX not_affected claim maps to exactly one image premise or source rule, and back" }
lint-fix       = { cmd = "ruff check --fix .", help = "Auto-fix ruff lint violations" }
format-fix     = { cmd = "ruff format .", help = "Apply ruff formatting" }
sql-fix        = { cmd = "sqlfluff fix packages/crawler/src", help = "Auto-fix the SQLite migrations" }
docs-build     = { cmd = "zensical build --clean --strict", help = "Build the documentation site (fails on broken links)" }
docs-serve     = { cmd = "zensical serve", help = "Preview the documentation site locally" }
lint-all       = { help = "Run every static check (no tests)", sequence = ["lint", "format-check", "dependency-check", "code-pattern-check", "architecture-check", "dead-code-check", "type-check", "pyrefly-check", "sql-lint", "template-check"] }
fix            = { help = "Auto-fix everything mechanical (ruff lint + format + sqlfluff)", sequence = ["lint-fix", "format-fix", "sql-fix"], ignore_fail = "return_non_zero" }
check          = { help = "The full gate: every static check + all unit tests", sequence = ["lint-all", "test"] }

# Every `src`, no tests (code only tests reach is dead), in one run: a package's API serves another.
# Not `pytest_settings`: test configuration, whose hook pytest calls by name.
[tool.vulture]
paths = [
  "packages/crawler/src",
  "packages/amule/src",
  "packages/matching/src",
  "packages/vex_checks/src",
  "packages/template_checks/src",
  "packages/coverage_checks/src",
  "packages/amule_bump/src",
  "vulture_whitelist.py",
]
min_confidence = 60

# deptry has no notion of test code: `src` alone against the runtime dependencies (DEP004 on a
# test-only import), then `src` and `tests` against them plus the `dev` group.
[tool.poe.tasks.dependency-check]
help = "Check each package's declared dependencies against its imports (deptry)"
sequence = [
  { cmd = "deptry src", cwd = "packages/matching" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/matching" },
  { cmd = "deptry src", cwd = "packages/crawler" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/crawler" },
  { cmd = "deptry src", cwd = "packages/amule" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/amule" },
  { cmd = "deptry src", cwd = "packages/vex_checks" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/vex_checks" },
  { cmd = "deptry src", cwd = "packages/template_checks" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/template_checks" },
  { cmd = "deptry src", cwd = "packages/coverage_checks" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/coverage_checks" },
  { cmd = "deptry src", cwd = "packages/amule_bump" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/amule_bump" },
  { cmd = "deptry src", cwd = "packages/pytest_settings" },
  { cmd = "deptry --non-dev-dependency-groups dev src tests", cwd = "packages/pytest_settings" },
]

# One mypy run per package, since every package's tests are a package named `tests`.
[tool.poe.tasks.type-check]
help = "Type-check each package with mypy (strict, src + tests)"
sequence = [
  { cmd = "mypy src tests", cwd = "packages/matching" },
  { cmd = "mypy src tests", cwd = "packages/crawler" },
  { cmd = "mypy src tests", cwd = "packages/amule" },
  { cmd = "mypy src tests", cwd = "packages/vex_checks" },
  { cmd = "mypy src tests", cwd = "packages/template_checks" },
  { cmd = "mypy src tests", cwd = "packages/coverage_checks" },
  { cmd = "mypy src tests", cwd = "packages/amule_bump" },
  { cmd = "mypy src tests", cwd = "packages/pytest_settings" },
]

# One run per package, each from its own `[tool.pyrefly]`: pyrefly's sub-configs cannot change import paths.
[tool.poe.tasks.pyrefly-check]
help = "Check each package's imports with pyrefly (src + tests), the resolution Serena's renames rely on"
sequence = [
  { cmd = "pyrefly check", cwd = "packages/matching" },
  { cmd = "pyrefly check", cwd = "packages/crawler" },
  { cmd = "pyrefly check", cwd = "packages/amule" },
  { cmd = "pyrefly check", cwd = "packages/vex_checks" },
  { cmd = "pyrefly check", cwd = "packages/template_checks" },
  { cmd = "pyrefly check", cwd = "packages/coverage_checks" },
  { cmd = "pyrefly check", cwd = "packages/amule_bump" },
  { cmd = "pyrefly check", cwd = "packages/pytest_settings" },
]

# `test` runs each package's suite in its own process (cwd) so per-package coverage
# stays isolated: a single root pytest run would mix coverage and break --cov-fail-under=100.
[tool.poe.tasks.test]
help = "Run every package's unit suite (per-package 100% branch coverage) and the VEX source rules' tests, then each module's by its own tests"
sequence = [
  { cmd = "pytest", cwd = "packages/matching" },
  { cmd = "pytest", cwd = "packages/crawler" },
  { cmd = "pytest", cwd = "packages/amule" },
  { cmd = "pytest", cwd = "packages/vex_checks" },
  { cmd = "ast-grep test --skip-snapshot-tests --config packages/vex_checks/ast-grep/sgconfig.yml" },
  { cmd = "pytest", cwd = "packages/template_checks" },
  { cmd = "pytest", cwd = "packages/coverage_checks" },
  { cmd = "pytest", cwd = "packages/amule_bump" },
  { cmd = "pytest", cwd = "packages/pytest_settings" },
  "_unit-coverage-check",
]

# Private: poe runs it only inside `test`, so it never reads a stale or partial `.coverage`.
[tool.poe.tasks._unit-coverage-check]
help = "Check each module is covered by its own tests, the test files mirroring src"
sequence = [
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/matching" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/crawler" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/amule" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/vex_checks" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/template_checks" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/coverage_checks" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/amule_bump" },
  { cmd = "python -m coverage_checks unit-coverage", cwd = "packages/pytest_settings" },
]
