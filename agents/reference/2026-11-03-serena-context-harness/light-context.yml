description: Claude Code, Serena described in a few lines (the light arm of the 2026-11-03 measurement)
prompt: |
  You are running in Claude Code, whose own tools read, edit and run commands. Serena adds the language server's
  view of the code: `get_symbols_overview` for a file's structure, `find_symbol` for a definition,
  `find_referencing_symbols` for every reference and override, `rename_symbol` for a rename that reaches them all,
  `replace_symbol_body` to replace a definition. Prefer them over grep when the question is about symbols and
  references.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - search_for_pattern

tool_description_overrides: {}
single_project: true
structured_tool_output: false
