id: no-protocol-base
language: python
severity: error
message: A port is an ABC its implementers and fakes inherit, never a structural `Protocol`.
note: "Inheritance lets the language server reach every implementer from the port (rename, references)."
files: ["packages/*/src/**/*.py"]
rule:
  kind: class_definition
  has:
    field: superclasses
    # A base `Protocol`, `typing.Protocol` or `Protocol[T]`.
    has: { regex: '^(typing\.)?Protocol(\[.*\])?$' }
  # A callback Protocol, whose only member is `__call__`, is no port.
  not:
    has:
      field: body
      all:
        - has: { kind: function_definition, has: { field: name, regex: '^__call__$' } }
        - not:
            has:
              not: { kind: function_definition, has: { field: name, regex: '^__call__$' } }
