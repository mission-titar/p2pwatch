id: dataclass-kw-only
language: python
severity: error
message: A dataclass is `kw_only=True`, so its construction names every field.
note: "Two fields of one type passed by position swap unseen; ruff's PLR0917 sees no dataclass."
files: ["packages/*/src/**/*.py", "packages/*/tests/**/*.py"]
# The zones not yet keyword-only: each line goes with the block that converts its zone.
ignores:
  - "packages/crawler/tests/adapters/**" # C6
rule:
  kind: decorator
  any:
    # `@dataclass` or `@dataclasses.dataclass`, bare.
    - has: { regex: '^(dataclasses\.)?dataclass$' }
    # Called without `kw_only=True`.
    - has:
        kind: call
        all:
          - has: { field: function, regex: '^(dataclasses\.)?dataclass$' }
          - not:
              has:
                field: arguments
                has:
                  kind: keyword_argument
                  all:
                    - has: { field: name, regex: ^kw_only$ }
                    - has: { field: value, regex: ^True$ }
