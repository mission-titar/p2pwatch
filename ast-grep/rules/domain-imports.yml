id: domain-imports
language: python
severity: error
message: A domain imports only the pure standard library on this list, `rapidfuzz`, `packaging.version`, `jinja2` and first-party packages; the dependency checks keep those to its own hexagon.
note: "A module that needs I/O goes behind a port; a new pure module is a new line here."
files: ["packages/*/src/*/domain/**/*.py"]
rule:
  matches: imported-module
  not:
    regex: ^(abc|ast|collections\.abc|configparser|dataclasses|datetime|difflib|enum|hashlib|io|ipaddress|jinja2|json|math|packaging\.version|pathlib|rapidfuzz|re|textwrap|typing|unicodedata|urllib\.parse|uuid|(amule_bump|catalog_matching|coverage_checks|p2pwatch|p2pwatch_amule|template_checks|vex_checks)(\.\w+)*)$
